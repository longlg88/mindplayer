<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindPlayer · TUI session trace 시안</title>
<style>
:root{color-scheme:dark;--bg:#282a36;--fg:#e2e2ed;--dim:#9295a5;--line:#474b60;--blue:#82aaff;--purple:#bd93f9;--green:#7cce94;--yellow:#edc97a}
*{box-sizing:border-box}body{margin:0;background:#1b1d26;color:var(--fg);font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:0;background:transparent;text-align:left}button:focus-visible,input:focus-visible{outline:1px solid var(--blue);outline-offset:-1px}button:hover{background:#383c50}header{max-width:1260px;margin:28px auto 14px;padding:0 20px;display:flex;justify-content:space-between;gap:16px;color:var(--dim);font-size:12px}header b{color:var(--fg);font-weight:500}.terminal{margin:0 auto;width:calc(100% - 40px);max-width:1220px;height:760px;max-height:calc(100dvh - 114px);min-height:480px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;padding:16px 20px}.top{display:flex;justify-content:space-between;gap:12px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:10px}.blue{color:var(--blue)}.green{color:var(--green)}.dim{color:var(--dim)}.purple{color:var(--purple)}.yellow{color:var(--yellow)}main{flex:1;overflow:auto;min-height:0}h1{font:inherit;color:var(--fg);margin:17px 0 0}p{margin:7px 0}.caption{font-size:12px;color:var(--dim)}.list-head,.session{display:grid;grid-template-columns:24px 90px 1fr 90px 90px;gap:12px;padding:9px 8px;width:100%;align-items:center}.list-head{color:var(--dim);margin-top:24px;border-bottom:1px solid var(--line)}.session.selected,.request.selected{background:#3b425d}.session .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{margin:36px 8px;color:var(--dim)}footer{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:8px 18px}footer button{padding:0;color:var(--dim)}kbd{font:inherit;color:var(--blue)}.cmd{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:26px}.cmd input{border:0;background:transparent;outline:none;width:100%}.tabs{display:flex;gap:22px;margin:18px 0 0;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button{padding:0;color:var(--dim)}.tabs button.active{color:var(--blue)}.stats{color:var(--dim);padding:12px 0;border-bottom:1px solid var(--line)}.stats strong{font-weight:400;color:var(--fg)}.split{display:grid;grid-template-columns:310px 1fr;min-height:360px}.requests{border-right:1px solid var(--line);padding:14px 12px 14px 0}.request{display:block;width:100%;padding:10px;margin-bottom:5px}.request small{display:block;color:var(--dim)}.detail{padding:18px 0 18px 24px}.step{border-left:1px solid var(--line);margin-left:5px;padding:0 0 17px 19px;position:relative}.step:before{content:'·';position:absolute;left:-5px;color:var(--blue);background:var(--bg)}.step:last-child{padding-bottom:0;border-color:transparent}.step-label{color:var(--purple);font-size:12px}.step p{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:inherit;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;color:#bac3d6}.data{width:100%;border-collapse:collapse;margin-top:16px}.data th,.data td{text-align:left;border-bottom:1px solid #3b3e50;padding:10px 8px;font-weight:400;vertical-align:top}.data th{color:var(--dim)}.data td:last-child{color:var(--green)}.bar{display:inline-block;height:8px;background:var(--purple);max-width:200px;vertical-align:middle;margin-right:12px}.note{margin-top:20px;color:var(--dim);font-size:12px}.notice{color:var(--yellow);min-height:23px}.below{max-width:1220px;margin:10px auto;color:var(--dim);font-size:12px;padding:0 4px}[hidden]{display:none!important}@media(max-width:760px){header{margin-top:12px;display:block}.terminal{width:calc(100% - 16px);padding:12px;max-height:none;height:800px}.split{grid-template-columns:1fr}.requests{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:10px 0}.request{min-width:210px}.detail{padding:16px 0}.session,.list-head{grid-template-columns:18px 65px 1fr 65px;gap:6px}.session span:last-child,.list-head span:last-child{display:none}.tabs{gap:12px;font-size:12px}.data{font-size:12px}.top{font-size:12px}.below{padding:0 12px}}
</style>
<header><b>MindPlayer / 세션 기록 UI 시안</b><span>Rust TUI 화면 미리보기 · 모든 기록·수치는 예시</span></header>
<section class="terminal" aria-label="MindPlayer 터미널 시안">
 <div class="top"><span><span class="blue">mindplayer</span> <span id="crumb">/ sessions</span></span><span>SendBird/working2</span></div>
 <main id="main"></main>
 <div class="notice" id="notice" role="status"></div>
 <div class="cmd" id="command" hidden><label for="input" class="blue">:</label><input id="input" autocomplete="off" spellcheck="false" aria-label="앱 내부 명령" placeholder="trace ↵"></div>
 <footer id="footer"></footer>
</section>
<div class="below">시안 조작: ↑↓ 선택 → :trace 입력 또는 아래 trace 클릭 → 1–4 탭 → Esc 복귀. 실제 세션 실행·수정은 없습니다.</div>
<script>
const sessions=[{id:'demo-a',title:'MindPlayer 세션 사용량 화면',agent:'codex',input:124000,cached:96000,output:4200},{id:'demo-b',title:'계정별 사용량 분리 수정',agent:'codex',input:58000,cached:41000,output:2600},{id:'demo-c',title:'통합 테스트 로그 검토',agent:'codex',input:18000,cached:10000,output:900}];
const requests=[{title:'현재 사용량 코드 확인해줘',input:32000,cached:24000,output:1100,file:'crates/mindplayer-tui/src/app.rs',range:'310–370',bytes:2400,why:'계정 표시와 갱신 상태를 확인하겠습니다.',cmd:'sed -n \'310,370p\' crates/mindplayer-tui/src/app.rs',result:'앱 상태 필드와 계정 패널 연결 위치를 확인했습니다.'},{title:'계정별 값이 같은 원인 찾아줘',input:48000,cached:40000,output:1500,file:'crates/mindplayer-core/src/accounts.rs',range:'80–160',bytes:3600,why:'계정 식별자가 조회 경로에 전달되는지 확인하겠습니다.',cmd:'sed -n \'80,160p\' crates/mindplayer-core/src/accounts.rs',result:'예시: 계정 선택과 조회 경로를 비교했습니다. 실제 버그 진단 기록은 아닙니다.'},{title:'확인한 내용 정리해줘',input:44000,cached:32000,output:1600,file:'crates/mindplayer-tui/src/app.rs',range:'310–370',bytes:2400,why:'앞서 확인한 앱 상태 필드를 다시 확인하겠습니다.',cmd:'sed -n \'310,370p\' crates/mindplayer-tui/src/app.rs',result:'같은 파일의 같은 범위를 재조회했습니다. 재조회가 필요했는지는 앞뒤 기록으로 판단할 수 있습니다.'}];
let selected=0,screen='list',tab=0,request=0;
const main=document.querySelector('#main'),footer=document.querySelector('#footer'),input=document.querySelector('#input');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v.toLocaleString('en-US');
function rows(){if(selected===0)return requests;const s=sessions[selected];return [{...requests[selected],title:s.title,input:s.input,cached:s.cached,output:s.output}];}
function action(label,fn){const b=document.createElement('button');b.innerHTML=label;b.onclick=fn;footer.append(b);}
function render(){const s=sessions[selected];document.querySelector('#crumb').textContent=screen==='list'?'/ sessions':`/ trace / ${s.id}`;footer.replaceChildren();document.querySelector('#notice').textContent='';
if(screen==='list'){
main.innerHTML=`<h1>sessions <span class="dim">· 3 example sessions</span></h1><p class="caption">세션을 선택한 뒤 :trace 명령으로 기록을 엽니다.</p><div class="list-head"><span></span><span>agent</span><span>session</span><span>tokens</span><span>updated</span></div>${sessions.map((s,i)=>`<button class="session ${selected===i?'selected':''}" data-session="${i}" aria-pressed="${selected===i}"><span class="blue">${selected===i?'›':' '}</span><span class="blue">${s.agent}</span><span class="name">${s.title}</span><span>${((s.input+s.output)/1000).toFixed(1)}k</span><span class="dim">예시</span></button>`).join('')}<p class="empty">선택 세션의 요청, 사용량, 파일 읽기와 실행 결과를 확인합니다.</p>`;
main.querySelectorAll('[data-session]').forEach(b=>{b.onclick=()=>{selected=Number(b.dataset.session);render();};b.ondblclick=openTrace;});
action('<kbd>↑↓</kbd> select',()=>{selected=(selected+1)%sessions.length;render();});action('<kbd>:trace</kbd> session history',openTrace);action('<kbd>:</kbd> command',openCommand);
}else{
main.innerHTML=`<h1>${esc(s.title)} <span class="dim">· ${s.agent} · 예시</span></h1><div class="stats">input <strong>${n(s.input)}</strong> (cached <strong>${n(s.cached)}</strong>) · output <strong>${n(s.output)}</strong> · total <strong>${n(s.input+s.output)}</strong></div><nav class="tabs" aria-label="기록 보기">${['흐름','토큰','파일 읽기','원본'].map((t,i)=>`<button class="${tab===i?'active':''}" data-tab="${i}" aria-pressed="${tab===i}">${i+1} ${t}</button>`).join('')}</nav><div id="view"></div>`;
main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);render();});renderView();
action('<kbd>Esc</kbd> sessions',()=>{screen='list';render();});action('<kbd>1–4</kbd> view',()=>{tab=(tab+1)%4;render();});action('<kbd>↑↓</kbd> request',()=>{request=(request+1)%rows().length;render();});
}main.scrollTop=0;}
function renderView(){const rs=rows(),r=rs[request],v=document.querySelector('#view'),s=sessions[selected];
if(tab===0)v.innerHTML=`<div class="split"><div class="requests">${rs.map((r,i)=>`<button class="request ${request===i?'selected':''}" data-request="${i}" aria-pressed="${request===i}"><span class="dim">0${i+1}</span> ${esc(r.title)}<small>${n(r.input+r.output)} tokens · ${n(r.cached)} cached</small></button>`).join('')}</div><div class="detail"><div class="step"><div class="step-label">REQUEST · 사용자</div><p>${esc(r.title)}</p></div><div class="step"><div class="step-label">APPROACH · 기록된 진행 설명</div><p>${esc(r.why)}</p></div><div class="step"><div class="step-label">EXECUTION · exec → exit 0</div><pre>${esc(r.cmd)}</pre><span class="dim">반환 텍스트 ${n(r.bytes)} bytes · 펼치면 도구 결과</span><details><summary class="blue">도구 결과 펼치기</summary><pre>[예시 출력 — 실제 소스 아님]\n${esc(r.file)}:${r.range}\n앱 상태 / 계정 조회 관련 코드</pre></details></div><div class="step"><div class="step-label">RESULT · 응답</div><p>${esc(r.result)}</p></div><p class="caption">공개 메시지와 도구 기록으로 연결합니다. 기록에 없는 판단 근거는 채워 넣지 않습니다.</p></div></div>`;
if(tab===1)v.innerHTML=`<table class="data"><thead><tr><th>사용량 구분</th><th>토큰</th><th>의미</th></tr></thead><tbody><tr><td>입력 전체</td><td>${n(s.input)}</td><td>모델 호출에서 처리한 입력 누적</td></tr><tr><td>└ 캐시된 입력</td><td>${n(s.cached)}</td><td>입력 전체에 포함 · 중복 합산하지 않음</td></tr><tr><td>└ 캐시되지 않은 입력</td><td>${n(s.input-s.cached)}</td><td>입력 전체 − 캐시된 입력</td></tr><tr><td>출력</td><td>${n(s.output)}</td><td>모델이 생성한 출력</td></tr><tr><td>합계</td><td>${n(s.input+s.output)}</td><td>입력 + 출력</td></tr></tbody></table><p class="note">누적 토큰은 고유하게 읽은 텍스트량이나 과금액과 다릅니다. 같은 문맥이 여러 호출에 포함될 수 있습니다.</p><table class="data"><thead><tr><th>요청별 사용량</th><th>input / cached / output</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.title)}</td><td>${n(r.input)} / ${n(r.cached)} / ${n(r.output)}</td></tr>`).join('')}</tbody></table><p class="caption">실제 로그에서 요청과 사용량을 연결할 수 없는 경우 ‘귀속 불명’으로 표시합니다.</p>`;
if(tab===2){const groups=new Map();for(const r of rs){const key=r.file+':'+r.range;const item=groups.get(key)||{...r,count:0,total:0};item.count++;item.total+=r.bytes;groups.set(key,item);}v.innerHTML=`<p style="margin-top:20px">어떤 내용을 얼마나 반복해서 읽었나</p><p class="caption">도구 호출에서 확인되는 파일·범위와 반환 텍스트 크기입니다.</p><table class="data"><thead><tr><th>파일 / 읽은 범위</th><th>횟수</th><th>반환량</th></tr></thead><tbody>${[...groups.values()].sort((a,b)=>b.count-a.count).map(r=>`<tr><td>${esc(r.file)}<br><span class="dim">lines ${r.range}</span></td><td class="${r.count>1?'yellow':''}">${r.count}${r.count>1?' · 동일 범위 재조회':''}</td><td>${n(r.total)} bytes</td></tr>`).join('')}</tbody></table><p class="note">반복 조회는 검토할 단서입니다. 변경 후 재확인처럼 필요한 재조회도 있으므로 ‘낭비’로 단정하지 않습니다.<br>파일별 정확한 토큰 기여량은 이 기록만으로 계산할 수 없습니다.</p>`;}
if(tab===3)v.innerHTML=`<p style="margin-top:20px" class="dim">선택 요청 #${request+1} · 설명용 원본 이벤트 예시</p><pre>${esc(JSON.stringify({example:true,session_id:s.id,request:r.title,assistant_message:r.why,tool_call:{name:'exec',command:r.cmd},tool_result:{exit_code:0,output_bytes:r.bytes},usage:{input_tokens:r.input,cached_input_tokens:r.cached,output_tokens:r.output},response:r.result},null,2))}</pre><p class="caption">실제 구현에서는 해당 요청에 연결된 로그 이벤트를 원본 순서로 표시합니다.</p>`;
v.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>{request=Number(b.dataset.request);render();});}
function openTrace(){screen='trace';request=0;tab=0;document.querySelector('#command').hidden=true;input.blur();render();}
function openCommand(){document.querySelector('#command').hidden=false;input.value='';input.focus();}
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(input.value.trim().replace(/^:/,'')==='trace')openTrace();else document.querySelector('#notice').textContent='시안에서 지원하는 명령: :trace';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!document.querySelector('#command').hidden){document.querySelector('#command').hidden=true;input.blur();}else if(screen==='trace'){screen='list';render();}return;}if(e.target===input)return;if(e.key===':'){e.preventDefault();openCommand();return;}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const d=e.key==='ArrowDown'?1:-1;if(screen==='list')selected=(selected+d+sessions.length)%sessions.length;else request=(request+d+rows().length)%rows().length;render();}if(screen==='trace'&&/^[1-4]$/.test(e.key)){tab=Number(e.key)-1;render();}});
render();
</script>
</html>

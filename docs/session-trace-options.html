<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindPlayer — 세 가지 TUI 시안</title>
<style>
:root{color-scheme:dark;--bg:#282a36;--fg:#e1e3ee;--muted:#979aaa;--line:#454959;--blue:#8caeff;--purple:#c4a0fa;--green:#8cd6a0;--amber:#e8c17b;--sel:#3c4563}*{box-sizing:border-box}body{margin:0;background:#191b23;color:var(--fg);font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}.wrap{max-width:1400px;margin:auto;padding:24px}h1{font-size:19px;margin:0;font-weight:500}.intro{color:var(--muted);font-size:12px;margin:6px 0 20px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.option{background:#232630;border:1px solid var(--line);padding:16px;text-align:left;min-height:118px}.option.active{border-color:var(--blue);background:#2b3347}.option b{display:block;font-weight:500;margin-bottom:6px}.option span{font-size:12px;color:var(--muted);display:block}.option em{font-style:normal;color:var(--blue);font-size:12px}.explain{display:flex;justify-content:space-between;gap:20px;margin:18px 0 10px;color:var(--muted);font-size:12px}.terminal{background:var(--bg);border:1px solid var(--line);height:650px;display:flex;flex-direction:column;padding:14px 18px}.bar{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:9px;color:var(--muted);font-size:12px}.blue{color:var(--blue)}.purple{color:var(--purple)}.green{color:var(--green)}.amber{color:var(--amber)}.muted{color:var(--muted)}.identity{padding-top:12px}.summary{font-size:12px;padding:5px 0 12px;color:var(--muted)}.summary strong{color:var(--fg);font-weight:400}.content{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--line)}footer{display:flex;gap:18px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}footer button,.plain{border:0;padding:0;background:none;text-align:left}kbd{font:inherit;color:var(--blue)}.request{background:none;border:0;border-left:2px solid transparent;padding:12px;width:100%;text-align:left}.request.selected{background:var(--sel);border-left-color:var(--blue)}.request small{display:block;color:var(--muted);font-size:12px}.transcript{padding:10px 0}.turn{margin-bottom:8px;border-bottom:1px solid var(--line)}.turn-body{padding:12px 20px 20px}.event{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:7px 0;font-size:12px}.event .label{color:var(--purple)}.event p{margin:0}.command{color:#c6cfdf;overflow-wrap:anywhere;white-space:pre-wrap}details{font-size:12px;color:var(--muted);margin:6px 0}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;font:inherit;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:32% 1fr;height:100%}.rail{border-right:1px solid var(--line);overflow:auto;padding:12px 10px 12px 0}.inspector{padding:18px 20px;overflow:auto}.section-title{font-size:12px;color:var(--muted);padding-bottom:12px}.inspector h2{font-size:14px;font-weight:500;margin:0 0 6px}.tokens{font-size:12px;color:var(--muted);margin-bottom:18px}.tokens b{color:var(--fg);font-weight:400}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:var(--muted);font-weight:400;text-align:left}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line)}.table tbody tr{cursor:pointer}.table tr.selected{background:var(--sel)}.spark{color:var(--purple);white-space:nowrap}.audit{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:18px 10px}.audit h2{font-size:12px;font-weight:400;color:var(--muted);margin:0 0 10px}.audit p{font-size:12px;margin:8px 0}.hint{color:var(--muted);font-size:11px;margin-top:10px}.bottom{font-size:12px;color:var(--muted);margin:12px 0}.list{padding-top:20px}.session{display:flex;gap:20px;background:var(--sel);padding:12px}.mini{color:var(--muted);font-size:12px}.legend{padding:8px 10px;color:var(--muted);font-size:11px}.table-wrap{overflow:auto}.empty{padding:20px}.controls{display:flex;gap:12px;align-items:center}.controls button{background:none;border:1px solid var(--line);font-size:12px;padding:3px 8px;color:var(--muted)}@media(max-width:800px){.wrap{padding:12px}.options{gap:6px}.option{padding:10px;min-height:145px}.option b{font-size:12px}.option span,.option em{font-size:11px}.explain{display:block}.terminal{padding:12px;height:740px}.split{grid-template-columns:1fr;height:auto}.rail{border-right:0;border-bottom:1px solid var(--line)}.inspector{padding:16px 4px}.audit{grid-template-columns:1fr}.table{min-width:680px}.event{grid-template-columns:75px 1fr;gap:8px}.bar{font-size:10px}.summary{font-size:11px}}
</style>
<div class="wrap">
<h1>같은 세션, 세 가지 읽는 방식</h1>
<p class="intro">MindPlayer 내부 TUI 설계 비교 · 상단 선택기는 HTML 시안용 · 세션 데이터는 모두 동일한 예시</p>
<nav class="options" aria-label="UI 시안 선택">
<button class="option" data-layout="a"><b>A / 대화 흐름형</b><span>요청부터 결과까지 위에서 아래로 읽기</span><em>대화 맥락을 이해하고 싶을 때</em></button>
<button class="option" data-layout="b"><b>B / 요청별 분할형</b><span>왼쪽에서 요청 선택, 오른쪽에서 상세 확인</span><em>특정 작업을 빠르게 찾아볼 때</em></button>
<button class="option" data-layout="c"><b>C / 토큰 분석형</b><span>사용량을 비교하고 큰 요청부터 추적</span><em>무엇이 많이 읽혔는지 조사할 때</em></button>
</nav>
<div class="explain"><span id="description"></span><div class="controls"><button id="entry">목록에서 진입해 보기</button><span>A / B / C 키로 시안 전환</span></div></div>
<section class="terminal" aria-label="TUI 미리보기">
<div class="bar"><span><span class="blue">mindplayer</span> <span id="breadcrumb"></span></span><span>SendBird/working2 · example</span></div>
<div id="heading"></div><main class="content" id="content"></main><footer id="footer"></footer>
</section>
<p class="bottom" id="tradeoff"></p>
<p class="hint">실제 구현 전 UI 비교입니다. 토큰은 입력 + 출력이며 캐시 입력은 입력에 포함됩니다. 반환 bytes는 토큰 수가 아닙니다. 반복 읽기만으로 낭비를 단정하지 않습니다.</p>
</div>
<script>
const data=[
 {id:1,time:'10:02',title:'현재 사용량 코드를 확인해줘',input:32000,cached:24000,output:1100,file:'app.rs',range:'310–370',bytes:2400,approach:'사용량이 화면에 연결되는 위치부터 확인하겠습니다.',command:"sed -n '310,370p' crates/mindplayer-tui/src/app.rs",result:'계정 패널과 사용량 상태의 연결 위치를 확인했습니다.'},
 {id:2,time:'10:05',title:'두 계정의 값이 같은 원인을 찾아줘',input:48000,cached:40000,output:1500,file:'accounts.rs',range:'80–160',bytes:3600,approach:'선택 계정과 조회 경로가 연결되는지 확인하겠습니다.',command:"sed -n '80,160p' crates/mindplayer-core/src/accounts.rs",result:'계정별 조회 경로를 비교했습니다. 이 내용은 설명용 예시입니다.'},
 {id:3,time:'10:09',title:'확인한 내용을 정리해줘',input:44000,cached:32000,output:1600,file:'app.rs',range:'310–370',bytes:2400,approach:'앞서 읽은 상태 필드를 다시 확인하겠습니다.',command:"sed -n '310,370p' crates/mindplayer-tui/src/app.rs",result:'같은 범위를 재조회한 뒤 내용을 정리했습니다.'}
];
const descriptions={a:'전체 폭을 대화 기록에 사용합니다. 요청별 실행은 펼쳐서 확인합니다.',b:'요청 목록은 유지하고 상세 영역만 바뀝니다. 기록 탐색에 집중합니다.',c:'요청별 사용량과 반복 읽기를 먼저 보여줍니다. 선택하면 아래에 근거가 나옵니다.'};
const tradeoffs={a:'장점: 맥락을 순서대로 읽기 쉬움  /  한계: 긴 세션에서 요청 간 수치 비교가 어려움',b:'장점: 목록 위치를 유지하며 요청을 빠르게 탐색  /  한계: 좁은 터미널에서 상세 폭이 줄어듦',c:'장점: 큰 요청과 재조회를 빠르게 발견  /  한계: 대화 맥락은 선택 후 상세에서 읽어야 함'};
let layout='a',selected=0,list=false,expanded=new Set([1]),sort=false;
const $=s=>document.querySelector(s),n=v=>v.toLocaleString('en-US'),safe=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
document.addEventListener('keydown',e=>{if(list&&e.key==='Enter')e.preventDefault();},true);
function events(r){return `<div class="event"><span class="label">진행 설명</span><p>${r.approach}</p></div><div class="event"><span class="label">실행</span><div class="command">${safe(r.command)}<details><summary>exit 0 · 반환 ${n(r.bytes)} bytes · 결과 펼치기</summary><pre>[예시 도구 출력]\n${r.file}:${r.range}\n관련 상태 필드와 조회 코드</pre></details></div></div><div class="event"><span class="label">결과</span><p>${r.result}</p></div>${r.id===3?'<div class="event"><span class="amber">동일 범위</span><p class="amber">#01에서 읽은 app.rs:310–370을 다시 조회했습니다.</p></div>':''}`;}
function tokenLine(r){return `<div class="tokens">input <b>${n(r.input)}</b> · cached <b>${n(r.cached)}</b> · output <b>${n(r.output)}</b></div>`;}
function footerButton(text,handler){const b=document.createElement('button');b.innerHTML=text;b.onclick=handler;$('#footer').append(b);}
function render(){document.querySelectorAll('[data-layout]').forEach(b=>{b.classList.toggle('active',b.dataset.layout===layout);b.setAttribute('aria-pressed',b.dataset.layout===layout);});$('#description').textContent=descriptions[layout];$('#tradeoff').textContent=tradeoffs[layout];$('#breadcrumb').textContent=list?'/ sessions':`/ trace / demo-session · ${layout.toUpperCase()}`;$('#heading').innerHTML=list?'':`<div class="identity">세션 사용량 조사 <span class="muted">· codex · 3 requests</span></div><div class="summary">total <strong>128,200</strong> · input <strong>124,000</strong> (cached <strong>96,000</strong>) · output <strong>4,200</strong></div>`;$('#footer').replaceChildren();const r=data[selected];
if(list){$('#content').innerHTML='<div class="list"><div class="mini">session list · 선택 행 유지</div><div class="session"><span class="blue">› codex</span><span>세션 사용량 조사</span><span class="muted">128.2k</span></div><p class="empty muted">:trace 명령으로 선택한 세션의 기록 화면으로 이동합니다.</p></div>';footerButton('<kbd>:trace</kbd> 기록 열기',()=>{list=false;render();});return;}
if(layout==='a')$('#content').innerHTML=`<div class="transcript">${data.map((r,i)=>`<section class="turn"><button class="request ${selected===i?'selected':''}" data-request="${i}" data-expand="true"><span class="muted">${r.time} · #0${r.id}</span> ${r.title}<small>${expanded.has(r.id)?'▾':'▸'} ${n(r.input+r.output)} tokens · input ${n(r.input)} / cached ${n(r.cached)} / output ${n(r.output)}</small></button>${expanded.has(r.id)?`<div class="turn-body">${events(r)}</div>`:''}</section>`).join('')}</div>`;
if(layout==='b')$('#content').innerHTML=`<div class="split"><aside class="rail"><div class="section-title">REQUESTS / 시간순</div>${data.map((r,i)=>`<button class="request ${selected===i?'selected':''}" data-request="${i}"><small>#0${r.id} · ${r.time}</small>${r.title}<small>${n(r.input+r.output)} tokens ${r.id===3?'· 동일 범위 재조회':''}</small></button>`).join('')}</aside><section class="inspector"><div class="section-title">#0${r.id} / REQUEST DETAIL</div><h2>${r.title}</h2>${tokenLine(r)}${events(r)}<p class="hint">판단 근거는 기록된 진행 설명만 표시합니다.</p></section></div>`;
if(layout==='c'){const ordered=sort?[...data].sort((a,b)=>(b.input+b.output)-(a.input+a.output)):data;$('#content').innerHTML=`<div class="legend">${sort?'사용량 많은 순':'시간순'} · █ 입력(캐시 제외) <span class="purple">▒ 캐시 입력</span> <span class="green">▏출력</span> · s 정렬 전환</div><div class="table-wrap"><table class="table"><thead><tr><th>요청</th><th>총 토큰</th><th>입력 구성</th><th>캐시 입력</th><th>출력</th><th>읽기</th></tr></thead><tbody>${ordered.map(r=>`<tr tabindex="0" aria-selected="${data[selected].id===r.id}" class="${data[selected].id===r.id?'selected':''}" data-request="${data.indexOf(r)}"><td>#0${r.id} ${r.title}</td><td>${n(r.input+r.output)}</td><td class="spark" aria-label="입력과 캐시 비중">${'█'.repeat(Math.round((r.input-r.cached)/4000))}${'▒'.repeat(Math.round(r.cached/4000))}<span class="green">▏</span></td><td>${n(r.cached)}</td><td>${n(r.output)}</td><td>${r.id===3?'동일 범위':'1회'}</td></tr>`).join('')}</tbody></table></div><div class="audit"><section><h2>선택 요청 #0${r.id} / 실행 근거</h2><p>${r.title}</p>${tokenLine(r)}${events(r)}</section><section><h2>세션 내 파일 읽기 / 도구 반환량</h2><p><span class="amber">2회</span> app.rs:310–370 <span class="muted">· 4,800 bytes</span></p><p class="muted">#01 → #03 · 같은 범위 재조회</p><p>1회 accounts.rs:80–160 <span class="muted">· 3,600 bytes</span></p><p class="hint">반복 조회는 검토할 단서입니다. 변경 후 재확인인지 기록과 함께 판단합니다.</p><p class="hint">파일별 토큰 기여량은 알 수 없습니다. 위 토큰은 요청에 연결된 사용량 예시입니다.</p></section></div>`;}
$('#content').querySelectorAll('[data-request]').forEach(b=>{b.onclick=()=>{selected=Number(b.dataset.request);if(b.dataset.expand)toggle();else render();};if(b.tagName==='TR')b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();selected=Number(b.dataset.request);render();}};});footerButton('<kbd>Esc</kbd> 목록',()=>{list=true;render();});footerButton('<kbd>j/k ↑↓</kbd> 요청 선택',()=>move(1));if(layout==='a')footerButton('<kbd>Enter</kbd> 펼침 / 접기',toggle);if(layout==='c')footerButton('<kbd>s</kbd> 사용량순 / 시간순',()=>{sort=!sort;render();});footerButton('<kbd>a/b/c</kbd> 시안 비교',()=>{layout={a:'b',b:'c',c:'a'}[layout];render();});}
function toggle(){const id=data[selected].id;expanded.has(id)?expanded.delete(id):expanded.add(id);render();}
function move(d){const ordered=layout==='c'&&sort?[...data].sort((a,b)=>(b.input+b.output)-(a.input+a.output)):data;selected=data.indexOf(ordered[(ordered.indexOf(data[selected])+d+data.length)%data.length]);render();$('#content').querySelector('.selected')?.scrollIntoView({block:'nearest'});}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;list=false;render();});$('#entry').onclick=()=>{list=true;render();};let command='';document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(list){if(e.key==='Escape'){command='';render();return;}if(e.key==='Enter'&&command===':trace'){list=false;command='';render();return;}if(e.key.length===1&&(command||e.key===':')){command+=e.key;$('#breadcrumb').textContent='/ sessions '+command;return;}if(e.key==='Backspace'){command=command.slice(0,-1);$('#breadcrumb').textContent='/ sessions '+command;e.preventDefault();return;}}if('abc'.includes(e.key)&&e.key.length===1){layout=e.key;list=false;render();return;}if(list)return;if(e.key==='Escape'){list=true;render();}if(['j','k','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();move(['j','ArrowDown'].includes(e.key)?1:-1);}if(e.key==='Enter'&&layout==='a'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle();}if(e.key==='s'&&layout==='c'){sort=!sort;render();}});render();
</script></html>
